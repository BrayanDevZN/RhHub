<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 1200" width="1420" height="1200" role="img" aria-labelledby="t d">
<title id="t">Modelagem do banco de dados do RhHub</title>
<desc id="d">Sete tabelas: users, user_photos, notifications, vacancies, vacancy_photos, resumes e dead_letters, com as chaves estrangeiras e as cardinalidades.</desc>
