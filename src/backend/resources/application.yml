spring:
  application:
    name: rhhub

server:
  port: ${PORT:8080}

app:
  environment: ${ENVIRONMENT:production}
  database:
    # postgresql://usuario:senha@host:5432/banco  ou  none (SQLite local em SQLITE_PATH)
    url: ${DATABASE_URL:none}
    sqlite-path: ${SQLITE_PATH:./data/rhhub.db}
    pool-size: ${DATABASE_POOL_SIZE:10}
  redis:
    # Sem as variáveis: Redis local padrão (localhost:6379). Sem senha: conecta só com host e porta.
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
  kafka:
    # none (ou vazia): Kafka local em localhost:9092. KAFKA_BOOTSTRAP_SERVERS também é aceita.
    url: ${KAFKA_URL:${KAFKA_BOOTSTRAP_SERVERS:none}}
    # Com a chave, conecta por SASL/PLAIN (o Dockerfile.kafka exige KAFKA_API_KEY); sem ela, sem autenticação.
    api-user: ${KAFKA_API_USER:rhhub}
    api-key: ${KAFKA_API_KEY:}
    partitions: 3
    retry-interval: 2s
    email-topic: email.send
    analysis-topic: resume.analysis
  ai:
    openai-key: ${OPENAI_API_KEY:}
    openai-model: ${OPENAI_MODEL:gpt-4o-mini}
    openai-base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    groq-key: ${GROQ_API_KEY:}
    groq-model: ${GROQ_MODEL:llama-3.3-70b-versatile}
    groq-base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
    timeout: 60s
  email:
    # Workflow "gmail" do n8n: POST com JWT (HS256) e corpo {type, to, subject, content}
    webhook-url: ${N8N_EMAIL_WEBHOOK_URL:https://n8n.nexoaicompany.com/webhook/a043ad9f-9a0c-4bbd-a142-f64a1cd524c0}
    jwt-secret: ${gmail_secret:}
    timeout: 15s
