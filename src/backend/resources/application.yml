spring:
  application:
    name: rhhub
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/rhhub}
    username: ${DATABASE_USER:rhhub}
    password: ${DATABASE_PASSWORD:rhhub}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

app:
  environment: ${ENVIRONMENT:production}
  ai:
    openai-key: ${OPENAI_API_KEY:}
    openai-model: ${OPENAI_MODEL:gpt-4o-mini}
    openai-base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    groq-key: ${GROQ_API_KEY:}
    groq-model: ${GROQ_MODEL:llama-3.3-70b-versatile}
    groq-base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
    timeout: 60s
