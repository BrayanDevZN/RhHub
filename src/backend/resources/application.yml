spring:
  application:
    name: rhhub
  codec:
    max-in-memory-size: 1MB
  webflux:
    multipart:
      max-in-memory-size: 1MB
      max-disk-usage-per-part: 6MB
      max-parts: 10

server:
  port: ${PORT:8080}

# O cliente do Kafka escreve centenas de linhas INFO (a config inteira a cada produtor, cada reconexão) e o Railway
# descarta logs acima de 500 por segundo: avisos e erros reais podiam sumir no meio.
logging:
  level:
    org.apache.kafka: WARN

app:
  environment: ${ENVIRONMENT:production}
  database:
    # postgresql://usuario:senha@host:5432/banco  ou  none (SQLite local em SQLITE_PATH)
    url: ${DATABASE_URL:none}
    sqlite-path: ${SQLITE_PATH:./data/rhhub.db}
    pool-size: ${DATABASE_POOL_SIZE:10}
  redis:
    # Sem as variáveis: Redis local padrão (localhost:6379). Sem senha: conecta só com host e porta.
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
  kafka:
    # none (ou vazia): Kafka local em localhost:9092. KAFKA_BOOTSTRAP_SERVERS também é aceita.
    url: ${KAFKA_URL:${KAFKA_BOOTSTRAP_SERVERS:none}}
    # Com a chave, conecta por SASL/PLAIN (o Dockerfile.kafka exige KAFKA_API_KEY); sem ela, sem autenticação.
    api-user: ${KAFKA_API_USER:rhhub}
    api-key: ${KAFKA_API_KEY:}
    # false na API (só publica); true no consumer, que lê as filas de análise e de e-mail
    consumers-enabled: ${KAFKA_CONSUMERS_ENABLED:true}
    partitions: 3
    retry-interval: 2s
    email-topic: email.send
    analysis-topic: resume.analysis
  ai:
    openai-key: ${OPENAI_API_KEY:${open_ai_key:}}
    openai-model: ${OPENAI_MODEL:gpt-4o-mini}
    openai-base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    groq-key: ${GROQ_API_KEY:${groq_key:}}
    groq-model: ${GROQ_MODEL:openai/gpt-oss-120b}
    groq-base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
    timeout: 60s
  auth:
    # Vazio: segredo aleatório gerado a cada subida (as sessões acabam ao reiniciar)
    jwt-secret: ${JWT_SECRET:}
    # Admin raiz: criado na subida se ainda não existir
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}
    rate-limit: ${RATE_LIMIT:60}
    global-rate-limit: ${GLOBAL_RATE_LIMIT:1000}
    google:
      enabled: ${GOOGLE_OAUTH_ENABLED:false}
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:}
  web:
    # FRONTEND_URL (ou o nome antigo FRONTEND_ORIGIN): origens liberadas no CORS (separadas por vírgula) e destino do login
    # com Google. Vazio: só mesma origem.
    frontend-origin: ${FRONTEND_URL:${FRONTEND_ORIGIN:}}
    # Vazio: Secure ligado (desligado só com ENVIRONMENT=test). Em http local use COOKIE_SECURE=false.
    cookie-secure: ${COOKIE_SECURE:}
    # Strict exige front e API no mesmo domínio (proxy do nginx em /api)
    cookie-same-site: ${COOKIE_SAMESITE:Strict}
  email:
    # Workflow "gmail" do n8n: POST com JWT (HS256) e corpo {type, to, subject, content}
    webhook-url: ${N8N_EMAIL_WEBHOOK_URL:https://n8n.nexoaicompany.com/webhook/a043ad9f-9a0c-4bbd-a142-f64a1cd524c0}
    jwt-secret: ${gmail_secret:}
    timeout: 15s
