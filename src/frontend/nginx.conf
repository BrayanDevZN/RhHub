# IP do cliente: a última entrada do X-Forwarded-For, a que o proxy da plataforma acrescentou. As anteriores o
# próprio cliente pode forjar. A API usa esse valor (e só ele) para o limite de requisições.
map $http_x_forwarded_for $rhhub_client_ip {
  default $remote_addr;
  "~(?<last>[^,\s]+)\s*$" $last;
}

server {
  include /etc/nginx/rhhub-listen.conf;
  include /etc/nginx/rhhub-api.conf;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
